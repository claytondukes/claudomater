[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudomater"
version = "2.0.0a0"
description = "Owned dev-pipeline orchestration: subagent phases, verifiers, usage guardrails (omater), plus the legacy story-automator runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Clayton Dukes" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
omater = "claudomater.cli:main"
story-automator = "story_automator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudomater", "src/story_automator"]
