# The orchestrator's own test suite runs in CI from day one — verifiers and
# guardrails are exactly the code that must not be tested in production on a
# consumer project. Guardrail ACs are exercised via the fake-usage injection
# path (OMATER_FAKE_USAGE) inside the pytest suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest tests/ -q
